services:
  - type: web
    name: defectbench-reannotation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 600 --graceful-timeout 60 --bind 0.0.0.0:$PORT reannotation_app:app
    envVars:
      - key: ANNOTATION_STORAGE_ROOT
        value: /tmp/annotation_storage
